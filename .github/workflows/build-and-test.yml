name: Build and test

on:
  pull_request:
    branches: [ master, main ]
  push:
    branches: [ main, dev/** ]

jobs:
  validate-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17
            21
            25
      - name: Configure Java environment variables
        run: |
          echo "JAVA_8_HOME=$JAVA_HOME_8_X64" >> "$GITHUB_ENV"
          echo "JAVA_17_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "JAVA_21_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "JAVA_25_HOME=$JAVA_HOME_25_X64" >> "$GITHUB_ENV"
      - name: Validate matrix
        run: python tools/kyro/template.py validate
      - name: Test tools and storage
        run: |
          python tools/kyro/test_tools.py
          python tools/kyro/test_storage.py
      - name: Core build and unit tests
        run: python tools/kyro/template.py core

  matrix-generator:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: set-matrix
        shell: python
        run: |
          import json, os
          targets = json.load(open('targets.json'))['targets']
          matrix = {'include': [{'mc': t['minecraft'], 'loader': loader} for t in targets for loader in t['loaders']]}
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('matrix=' + json.dumps(matrix) + '\n')

  build-all-targets:
    needs: [validate-and-test, matrix-generator]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJSON(needs.matrix-generator.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            16
            17
            21
            25
      - name: Configure Java environment variables
        run: |
          echo "JAVA_8_HOME=$JAVA_HOME_8_X64" >> "$GITHUB_ENV"
          echo "JAVA_16_HOME=$JAVA_HOME_16_X64" >> "$GITHUB_ENV"
          echo "JAVA_17_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "JAVA_21_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "JAVA_25_HOME=$JAVA_HOME_25_X64" >> "$GITHUB_ENV"
      - name: Build target artifact
        run: |
          chmod +x gradlew modw
          python tools/kyro/template.py gradle "-Pmc=${{ matrix.mc }}" "-Ploader=${{ matrix.loader }}" build
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dimtoggle-${{ matrix.mc }}-${{ matrix.loader }}
          path: build/${{ matrix.mc }}/${{ matrix.loader }}/libs/*.jar
          if-no-files-found: ignore
