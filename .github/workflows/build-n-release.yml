name: build-n-release

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish GitHub release and sync CurseForge'
        required: false
        default: false
        type: boolean
      tag_name:
        description: 'Explicit tag (e.g. v1.0.0, or leave empty to use mod.properties)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: build-n-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  base-validation:
    name: Base Validation & Matrix Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Configure Java environment
        run: echo "JAVA_21_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
      - name: Validate target matrix and metadata
        run: python tools/kyro/template.py validate
      - name: Test tools and storage
        run: |
          python tools/kyro/test_tools.py
          python tools/kyro/test_storage.py
      - name: Execute core unit tests
        run: python tools/kyro/template.py core

  build-1-16:
    name: "${{ matrix.mc }} (${{ matrix.loader }})"
    needs: base-validation
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 49
      matrix:
        include:
          - mc: '1.16'
            loader: 'fabric'
          - mc: '1.16.1'
            loader: 'fabric'
          - mc: '1.16.1'
            loader: 'forge'
          - mc: '1.16.2'
            loader: 'fabric'
          - mc: '1.16.2'
            loader: 'forge'
          - mc: '1.16.3'
            loader: 'fabric'
          - mc: '1.16.3'
            loader: 'forge'
          - mc: '1.16.4'
            loader: 'fabric'
          - mc: '1.16.4'
            loader: 'forge'
          - mc: '1.16.5'
            loader: 'fabric'
          - mc: '1.16.5'
            loader: 'forge'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
          cache: gradle
      - name: Configure Java environment variables
        run: |
          echo "JAVA_8_HOME=$JAVA_HOME_8_X64" >> "$GITHUB_ENV"
      - name: Build ${{ matrix.mc }} (${{ matrix.loader }})
        run: |
          chmod +x gradlew modw
          for attempt in 1 2 3; do
            echo "Build attempt $attempt..."
            if python tools/kyro/template.py gradle "-Pmc=${{ matrix.mc }}" "-Ploader=${{ matrix.loader }}" --build-cache build; then
              exit 0
            fi
            echo "Attempt $attempt failed. Waiting 15s before retrying..."
            sleep 15
          done
          exit 1
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: "dimtoggle-${{ matrix.mc }}-${{ matrix.loader }}"
          path: build/${{ matrix.mc }}/${{ matrix.loader }}/libs/*.jar
          if-no-files-found: ignore

