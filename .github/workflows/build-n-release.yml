  verify-pipeline:
    name: Pipeline Verification & Diagnostics
    needs: [base-validation, build-1-16, build-1-17, build-1-18, build-1-19, build-1-20, build-1-21, build-26]
    if: always() && !cancelled() && needs.base-validation.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate target matrix count
        run: |
          python -c "
          import json
          with open('targets.json') as f:
              targets = json.load(f)['targets']
          total = sum(len(t['loaders']) for t in targets)
          print(f'Total configured targets across all versions: {total}')
          "
      - name: Pipeline Diagnostics & Pull Request Report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python tools/kyro/ci_report.py --run-id "${{ github.run_id }}" --pr-number "${{ github.event.pull_request.number }}"

  publish-release:
    name: Publish Release & CurseForge Description
    needs: [ base-validation, verify-pipeline ]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == true)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-jars
          pattern: "dimtoggle-*"
          merge-multiple: true
      - name: Resolve project version
        id: version
        run: |
          MOD_VER=$(grep '^mod.version=' properties/mod.properties | cut -d'=' -f2)
          echo "mod_version=$MOD_VER" >> "$GITHUB_OUTPUT"
          TAG="${{ github.event.inputs.tag_name }}"
          if [ -z "$TAG" ]; then
            TAG="v$MOD_VER"
          fi
          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag_name }}"
          VERSION="${{ steps.version.outputs.mod_version }}"
          NOTES="DimToggle release $VERSION covering all supported Minecraft versions across Fabric, Forge, and NeoForge."
          gh release create "$TAG" release-jars/*.jar --title "DimToggle $VERSION" --notes "$NOTES" || echo "Release already exists"
      - name: Publish to CurseForge & Sync Description
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN || secrets.CURSEFORGE_API_KEY }}
          CURSEFORGE_PROJECT_ID: ${{ secrets.CURSEFORGE_PROJECT_ID }}
        run: |
          python tools/kyro/curseforge_sync.py
