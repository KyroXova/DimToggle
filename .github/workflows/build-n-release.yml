name: build-n-release

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish GitHub release and sync CurseForge'
        required: false
        default: false
        type: boolean
      tag_name:
        description: 'Explicit tag (e.g. v1.0.0, or leave empty to use mod.properties)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: build-n-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  base-validation:
    name: Base Validation & Matrix Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Configure Java environment
        run: echo "JAVA_21_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
      - name: Validate target matrix and metadata
        run: python tools/kyro/template.py validate
      - name: Test tools and storage
        run: |
          python tools/kyro/test_tools.py
          python tools/kyro/test_storage.py
      - name: Execute core unit tests
        run: python tools/kyro/template.py core

  neoforge-builds:
    name: NeoForge ${{ matrix.minecraft }}
    needs: base-validation
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        minecraft:
          - '1.20.2'
          - '1.20.3'
          - '1.20.4'
          - '1.20.5'
          - '1.20.6'
          - '1.21'
          - '1.21.1'
          - '1.21.2'
          - '1.21.3'
          - '1.21.4'
          - '1.21.5'
          - '1.21.6'
          - '1.21.7'
          - '1.21.8'
          - '1.21.9'
          - '1.21.10'
          - '1.21.11'
          - '26.1'
          - '26.1.1'
          - '26.1.2'
          - '26.2'
          - '26.3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
            25
      - name: Configure Java environment variables
        run: |
          echo "JAVA_17_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "JAVA_21_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "JAVA_25_HOME=$JAVA_HOME_25_X64" >> "$GITHUB_ENV"
      - name: Build NeoForge ${{ matrix.minecraft }}
        run: |
          chmod +x gradlew modw
          python tools/kyro/template.py gradle "-Pmc=${{ matrix.minecraft }}" "-Ploader=neoforge" build
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dimtoggle-${{ matrix.minecraft }}-neoforge
          path: build/${{ matrix.minecraft }}/neoforge/libs/*.jar
          if-no-files-found: ignore

  forge-builds:
    name: Forge ${{ matrix.minecraft }}
    needs: base-validation
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        minecraft:
          - '1.16.1'
          - '1.16.2'
          - '1.16.3'
          - '1.16.4'
          - '1.16.5'
          - '1.17.1'
          - '1.18'
          - '1.18.1'
          - '1.18.2'
          - '1.19'
          - '1.19.1'
          - '1.19.2'
          - '1.19.3'
          - '1.19.4'
          - '1.20'
          - '1.20.1'
          - '1.20.2'
          - '1.20.3'
          - '1.20.4'
          - '1.20.6'
          - '1.21'
          - '1.21.1'
          - '1.21.3'
          - '1.21.4'
          - '1.21.5'
          - '1.21.6'
          - '1.21.7'
          - '1.21.8'
          - '1.21.9'
          - '1.21.10'
          - '1.21.11'
          - '26.1'
          - '26.1.1'
          - '26.1.2'
          - '26.2'
          - '26.3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            16
            17
            21
            25
      - name: Configure Java environment variables
        run: |
          echo "JAVA_8_HOME=$JAVA_HOME_8_X64" >> "$GITHUB_ENV"
          echo "JAVA_16_HOME=$JAVA_HOME_16_X64" >> "$GITHUB_ENV"
          echo "JAVA_17_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "JAVA_21_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "JAVA_25_HOME=$JAVA_HOME_25_X64" >> "$GITHUB_ENV"
      - name: Build Forge ${{ matrix.minecraft }}
        run: |
          chmod +x gradlew modw
          python tools/kyro/template.py gradle "-Pmc=${{ matrix.minecraft }}" "-Ploader=forge" build
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dimtoggle-${{ matrix.minecraft }}-forge
          path: build/${{ matrix.minecraft }}/forge/libs/*.jar
          if-no-files-found: ignore

  fabric-builds:
    name: Fabric ${{ matrix.minecraft }}
    needs: base-validation
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        minecraft:
          - '1.16'
          - '1.16.1'
          - '1.16.2'
          - '1.16.3'
          - '1.16.4'
          - '1.16.5'
          - '1.17'
          - '1.17.1'
          - '1.18'
          - '1.18.1'
          - '1.18.2'
          - '1.19'
          - '1.19.1'
          - '1.19.2'
          - '1.19.3'
          - '1.19.4'
          - '1.20'
          - '1.20.1'
          - '1.20.2'
          - '1.20.3'
          - '1.20.4'
          - '1.20.5'
          - '1.20.6'
          - '1.21'
          - '1.21.1'
          - '1.21.2'
          - '1.21.3'
          - '1.21.4'
          - '1.21.5'
          - '1.21.6'
          - '1.21.7'
          - '1.21.8'
          - '1.21.9'
          - '1.21.10'
          - '1.21.11'
          - '26.1'
          - '26.1.1'
          - '26.1.2'
          - '26.2'
          - '26.3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            16
            17
            21
            25
      - name: Configure Java environment variables
        run: |
          echo "JAVA_8_HOME=$JAVA_HOME_8_X64" >> "$GITHUB_ENV"
          echo "JAVA_16_HOME=$JAVA_HOME_16_X64" >> "$GITHUB_ENV"
          echo "JAVA_17_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "JAVA_21_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "JAVA_25_HOME=$JAVA_HOME_25_X64" >> "$GITHUB_ENV"
      - name: Build Fabric ${{ matrix.minecraft }}
        run: |
          chmod +x gradlew modw
          python tools/kyro/template.py gradle "-Pmc=${{ matrix.minecraft }}" "-Ploader=fabric" build
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dimtoggle-${{ matrix.minecraft }}-fabric
          path: build/${{ matrix.minecraft }}/fabric/libs/*.jar
          if-no-files-found: ignore

  build-checks:
    name: Matrix Checks & Pipeline Verification
    needs: [base-validation, neoforge-builds, forge-builds, fabric-builds]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Verify build pipeline results
        run: |
          echo "All loader builds (NeoForge, Forge, Fabric) completed."
          echo "NeoForge: ${{ needs.neoforge-builds.result }}"
          echo "Forge: ${{ needs.forge-builds.result }}"
          echo "Fabric: ${{ needs.fabric-builds.result }}"
          if [ "${{ needs.base-validation.result }}" != "success" ]; then
            echo "Base validation failed!"
            exit 1
          fi

  release-and-curseforge:
    name: Publish Release & CurseForge Preview
    needs: [build-checks]
    if: github.ref == 'refs/heads/main' || inputs.publish_release == true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Prepare release bundles
        id: prep
        shell: bash
        run: |
          mkdir -p release-bundle
          find release-artifacts -name "*.jar" ! -name "*sources*" ! -name "*dev*" -exec cp {} release-bundle/ \;
          COUNT=$(find release-bundle -name "*.jar" | wc -l)
          echo "Collected $COUNT JAR artifacts for release."
          
          MOD_VERSION=$(grep -E '^[[:space:]]*mod\.version[[:space:]]*=' properties/mod.properties | cut -d'=' -f2 | tr -d ' \r\n')
          TAG="${{ inputs.tag_name }}"
          if [ -z "$TAG" ]; then
            TAG="v${MOD_VERSION}"
          fi
          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$MOD_VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.prep.outputs.tag_name }}
          VERSION: ${{ steps.prep.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists, uploading assets..."
            gh release upload "$TAG" release-bundle/*.jar --clobber
          else
            echo "Creating release $TAG..."
            gh release create "$TAG" release-bundle/*.jar \
              --title "DimToggle ${VERSION}" \
              --notes-file Curseforge-desc.md
          fi

      - name: Sync CurseForge description
        uses: Kir-Antipov/update-curseforge-project@v1
        if: env.CURSEFORGE_TOKEN != ''
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        with:
          token: ${{ secrets.CURSEFORGE_TOKEN }}
          project_id: ${{ vars.CURSEFORGE_PROJECT_ID || '1466149' }}
          changelog-file: Curseforge-desc.md
