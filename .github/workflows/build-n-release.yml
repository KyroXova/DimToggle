name: build-n-release

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish GitHub release and sync CurseForge'
        required: false
        default: false
        type: boolean
      tag_name:
        description: 'Explicit tag (e.g. v1.0.0, or leave empty to use mod.properties)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: build-n-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  base-validation:
    name: Base Validation & Matrix Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Configure Java environment
        run: echo "JAVA_21_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
      - name: Validate target matrix and metadata
        run: python tools/kyro/template.py validate
      - name: Test tools and storage
        run: |
          python tools/kyro/test_tools.py
          python tools/kyro/test_storage.py
      - name: Execute core unit tests
        run: python tools/kyro/template.py core

  build-batch-1:
    name: "${{ matrix.mc }} (${{ matrix.loader }})"
    needs: base-validation
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - mc: '1.16'
            loader: 'fabric'
          - mc: '1.16.1'
            loader: 'fabric'
          - mc: '1.16.1'
            loader: 'forge'
          - mc: '1.16.2'
            loader: 'fabric'
          - mc: '1.16.2'
            loader: 'forge'
          - mc: '1.16.3'
            loader: 'fabric'
          - mc: '1.16.3'
            loader: 'forge'
          - mc: '1.16.4'
            loader: 'fabric'
          - mc: '1.16.4'
            loader: 'forge'
          - mc: '1.16.5'
            loader: 'fabric'
          - mc: '1.16.5'
            loader: 'forge'
          - mc: '1.17'
            loader: 'fabric'
          - mc: '1.17.1'
            loader: 'fabric'
          - mc: '1.17.1'
            loader: 'forge'
          - mc: '1.18'
            loader: 'fabric'
          - mc: '1.18'
            loader: 'forge'
          - mc: '1.18.1'
            loader: 'fabric'
          - mc: '1.18.1'
            loader: 'forge'
          - mc: '1.18.2'
            loader: 'fabric'
          - mc: '1.18.2'
            loader: 'forge'
          - mc: '1.19'
            loader: 'fabric'
          - mc: '1.19'
            loader: 'forge'
          - mc: '1.19.1'
            loader: 'fabric'
          - mc: '1.19.1'
            loader: 'forge'
          - mc: '1.19.2'
            loader: 'fabric'
          - mc: '1.19.2'
            loader: 'forge'
          - mc: '1.19.3'
            loader: 'fabric'
          - mc: '1.19.3'
            loader: 'forge'
          - mc: '1.19.4'
            loader: 'fabric'
          - mc: '1.19.4'
            loader: 'forge'
          - mc: '1.20'
            loader: 'fabric'
          - mc: '1.20'
            loader: 'forge'
          - mc: '1.20.1'
            loader: 'fabric'
          - mc: '1.20.1'
            loader: 'forge'
          - mc: '1.20.2'
            loader: 'fabric'
          - mc: '1.20.2'
            loader: 'forge'
          - mc: '1.20.2'
            loader: 'neoforge'
          - mc: '1.20.3'
            loader: 'fabric'
          - mc: '1.20.3'
            loader: 'forge'
          - mc: '1.20.3'
            loader: 'neoforge'
          - mc: '1.20.4'
            loader: 'fabric'
          - mc: '1.20.4'
            loader: 'forge'
          - mc: '1.20.4'
            loader: 'neoforge'
          - mc: '1.20.5'
            loader: 'fabric'
          - mc: '1.20.5'
            loader: 'neoforge'
          - mc: '1.20.6'
            loader: 'fabric'
          - mc: '1.20.6'
            loader: 'forge'
          - mc: '1.20.6'
            loader: 'neoforge'
          - mc: '1.21'
            loader: 'fabric'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            16
            17
            21
          cache: gradle
      - name: Configure Java environment variables
        run: |
          echo "JAVA_8_HOME=$JAVA_HOME_8_X64" >> "$GITHUB_ENV"
          echo "JAVA_16_HOME=$JAVA_HOME_16_X64" >> "$GITHUB_ENV"
          echo "JAVA_17_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "JAVA_21_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
      - name: Build ${{ matrix.mc }} (${{ matrix.loader }})
        run: |
          chmod +x gradlew modw
          python tools/kyro/template.py gradle "-Pmc=${{ matrix.mc }}" "-Ploader=${{ matrix.loader }}" --build-cache build || (sleep 10 && python tools/kyro/template.py gradle "-Pmc=${{ matrix.mc }}" "-Ploader=${{ matrix.loader }}" --build-cache build)
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: "dimtoggle-${{ matrix.mc }}-${{ matrix.loader }}"
          path: build/${{ matrix.mc }}/${{ matrix.loader }}/libs/*.jar
          if-no-files-found: ignore

  build-batch-2:
    name: "${{ matrix.mc }} (${{ matrix.loader }})"
    needs: [base-validation, build-batch-1]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - mc: '1.21'
            loader: 'forge'
          - mc: '1.21'
            loader: 'neoforge'
          - mc: '1.21.1'
            loader: 'fabric'
          - mc: '1.21.1'
            loader: 'forge'
          - mc: '1.21.1'
            loader: 'neoforge'
          - mc: '1.21.2'
            loader: 'fabric'
          - mc: '1.21.2'
            loader: 'neoforge'
          - mc: '1.21.3'
            loader: 'fabric'
          - mc: '1.21.3'
            loader: 'forge'
          - mc: '1.21.3'
            loader: 'neoforge'
          - mc: '1.21.4'
            loader: 'fabric'
          - mc: '1.21.4'
            loader: 'forge'
          - mc: '1.21.4'
            loader: 'neoforge'
          - mc: '1.21.5'
            loader: 'fabric'
          - mc: '1.21.5'
            loader: 'forge'
          - mc: '1.21.5'
            loader: 'neoforge'
          - mc: '1.21.6'
            loader: 'fabric'
          - mc: '1.21.6'
            loader: 'forge'
          - mc: '1.21.6'
            loader: 'neoforge'
          - mc: '1.21.7'
            loader: 'fabric'
          - mc: '1.21.7'
            loader: 'forge'
          - mc: '1.21.7'
            loader: 'neoforge'
          - mc: '1.21.8'
            loader: 'fabric'
          - mc: '1.21.8'
            loader: 'forge'
          - mc: '1.21.8'
            loader: 'neoforge'
          - mc: '1.21.9'
            loader: 'fabric'
          - mc: '1.21.9'
            loader: 'forge'
          - mc: '1.21.9'
            loader: 'neoforge'
          - mc: '1.21.10'
            loader: 'fabric'
          - mc: '1.21.10'
            loader: 'forge'
          - mc: '1.21.10'
            loader: 'neoforge'
          - mc: '1.21.11'
            loader: 'fabric'
          - mc: '1.21.11'
            loader: 'forge'
          - mc: '1.21.11'
            loader: 'neoforge'
          - mc: '26.1'
            loader: 'fabric'
          - mc: '26.1'
            loader: 'forge'
          - mc: '26.1'
            loader: 'neoforge'
          - mc: '26.1.1'
            loader: 'fabric'
          - mc: '26.1.1'
            loader: 'forge'
          - mc: '26.1.1'
            loader: 'neoforge'
          - mc: '26.1.2'
            loader: 'fabric'
          - mc: '26.1.2'
            loader: 'forge'
          - mc: '26.1.2'
            loader: 'neoforge'
          - mc: '26.2'
            loader: 'fabric'
          - mc: '26.2'
            loader: 'forge'
          - mc: '26.2'
            loader: 'neoforge'
          - mc: '26.3'
            loader: 'fabric'
          - mc: '26.3'
            loader: 'forge'
          - mc: '26.3'
            loader: 'neoforge'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
          cache: gradle
      - name: Configure Java environment variables
        run: |
          echo "JAVA_21_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "JAVA_25_HOME=$JAVA_HOME_25_X64" >> "$GITHUB_ENV"
      - name: Build ${{ matrix.mc }} (${{ matrix.loader }})
        run: |
          chmod +x gradlew modw
          python tools/kyro/template.py gradle "-Pmc=${{ matrix.mc }}" "-Ploader=${{ matrix.loader }}" --build-cache build || (sleep 10 && python tools/kyro/template.py gradle "-Pmc=${{ matrix.mc }}" "-Ploader=${{ matrix.loader }}" --build-cache build)
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: "dimtoggle-${{ matrix.mc }}-${{ matrix.loader }}"
          path: build/${{ matrix.mc }}/${{ matrix.loader }}/libs/*.jar
          if-no-files-found: ignore

  verify-pipeline:
    name: Pipeline Verification & Matrix Checks
    needs: [base-validation, build-batch-1, build-batch-2]
    if: always() && !cancelled() && needs.base-validation.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate all build artifacts
        run: |
          python -c "
          import json, glob
          with open('targets.json') as f:
              targets = json.load(f)['targets']
          total = sum(len(t['loaders']) for t in targets)
          print(f'Total configured targets across all versions: {total}')
          "

  publish-release:
    name: Publish Release & CurseForge Description
    needs: [ base-validation, verify-pipeline ]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == true)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-jars
          pattern: "dimtoggle-*"
          merge-multiple: true
      - name: Resolve project version
        id: version
        run: |
          MOD_VER=$(grep '^mod.version=' properties/mod.properties | cut -d'=' -f2)
          echo "mod_version=$MOD_VER" >> "$GITHUB_OUTPUT"
          TAG="${{ github.event.inputs.tag_name }}"
          if [ -z "$TAG" ]; then
            TAG="v$MOD_VER"
          fi
          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag_name }}"
          VERSION="${{ steps.version.outputs.mod_version }}"
          NOTES="DimToggle release $VERSION covering all supported Minecraft versions across Fabric, Forge, and NeoForge."
          gh release create "$TAG" release-jars/*.jar --title "DimToggle $VERSION" --notes "$NOTES" || echo "Release already exists"
      - name: Sync CurseForge Description
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          CURSEFORGE_PROJECT_ID: ${{ secrets.CURSEFORGE_PROJECT_ID }}
        run: |
          if [ -n "$CURSEFORGE_API_KEY" ] && [ -n "$CURSEFORGE_PROJECT_ID" ]; then
            python tools/kyro/curseforge_sync.py
          else
            echo "CurseForge secrets not configured; skipping description sync."
          fi
