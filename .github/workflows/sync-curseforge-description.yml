name: Synchronize CurseForge description

on:
  workflow_call:
    secrets:
      CURSEFORGE_TOKEN:
        required: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Update CurseForge project description
        if: env.CURSEFORGE_TOKEN != '' && env.CURSEFORGE_PROJECT_ID != ''
        uses: btwonion/mc-readme-sync@011dd459df6af7c1dd202300ffd43d91752315b1
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID || secrets.CURSEFORGE_PROJECT_ID }}
        with:
          curseforge-api-key: ${{ secrets.CURSEFORGE_TOKEN }}
          curseforge-project-id: ${{ env.CURSEFORGE_PROJECT_ID }}
          readme-path: Curseforge-desc.md
