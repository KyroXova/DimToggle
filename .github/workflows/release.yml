name: Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag matching mod.version (e.g. v1.0.0), or leave empty to use properties'
        required: false
        default: ''
      prerelease:
        description: 'Mark as prerelease'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check-version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      target_tag: ${{ steps.check.outputs.target_tag }}
      release_title: ${{ steps.check.outputs.release_title }}
      is_prerelease: ${{ steps.check.outputs.is_prerelease }}
      make_latest: ${{ steps.check.outputs.make_latest }}
      github_release_exists: ${{ steps.check.outputs.github_release_exists }}
      release_commit_sha: ${{ steps.check.outputs.release_commit_sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine if release is needed
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MANUAL_TAG: ${{ inputs.tag_name }}
          MANUAL_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          MOD_VERSION=$(grep -E '^[[:space:]]*mod\.version[[:space:]]*=' properties/mod.properties | cut -d'=' -f2 | tr -d ' \r\n')
          echo "Current mod.version: '$MOD_VERSION'"

          SHOULD_RELEASE="true"
          TARGET_TAG=""
          RELEASE_TITLE=""
          IS_PRE="false"
          MAKE_LATEST="true"

          if [[ -n "$MANUAL_TAG" ]]; then
            TARGET_TAG="$MANUAL_TAG"
            RELEASE_TITLE="DimToggle $MANUAL_TAG"
            IS_PRE="${MANUAL_PRERELEASE:-false}"
            MAKE_LATEST=$([[ "$IS_PRE" == "true" ]] && echo "false" || echo "true")
          else
            TARGET_TAG="v${MOD_VERSION:-1.0.0}"
            RELEASE_TITLE="DimToggle v${MOD_VERSION:-1.0.0}"
            if [[ "$TARGET_TAG" == *-snapshot || "$TARGET_TAG" == *-pre || "$TARGET_TAG" == *-alpha || "$TARGET_TAG" == *-beta ]]; then
              IS_PRE="true"
              MAKE_LATEST="false"
            else
              IS_PRE="false"
              MAKE_LATEST="true"
            fi
          fi

          if [[ "$MANUAL_PRERELEASE" == "true" ]]; then
            IS_PRE="true"
            MAKE_LATEST="false"
          fi

          if git rev-parse --quiet --verify "refs/tags/${TARGET_TAG}^{commit}" >/dev/null; then
            RELEASE_COMMIT_SHA=$(git rev-parse "refs/tags/${TARGET_TAG}^{commit}")
          else
            RELEASE_COMMIT_SHA=$(git rev-parse HEAD)
          fi

          GITHUB_RELEASE_EXISTS="false"
          if RELEASE_RESULT=$(gh api "repos/${{ github.repository }}/releases/tags/$TARGET_TAG" 2>&1); then
            GITHUB_RELEASE_EXISTS="true"
            SHOULD_RELEASE="false"
            echo "Release $TARGET_TAG already exists; skipping duplicate publication."
          elif [[ "$RELEASE_RESULT" != *"HTTP 404"* ]]; then
            echo "Could not verify the GitHub release: $RELEASE_RESULT" >&2
            exit 1
          fi

          echo "should_release=${SHOULD_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "target_tag=${TARGET_TAG}" >> "$GITHUB_OUTPUT"
          echo "release_title=${RELEASE_TITLE}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${IS_PRE}" >> "$GITHUB_OUTPUT"
          echo "make_latest=${MAKE_LATEST}" >> "$GITHUB_OUTPUT"
          echo "github_release_exists=${GITHUB_RELEASE_EXISTS}" >> "$GITHUB_OUTPUT"
          echo "release_commit_sha=${RELEASE_COMMIT_SHA}" >> "$GITHUB_OUTPUT"

  fabric:
    name: Fabric ${{ matrix.minecraft }}
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        minecraft:
          - '1.18.2'
          - '1.19.2'
          - '1.19.4'
          - '1.20.1'
          - '1.20.4'
          - '1.21.1'
          - '1.21.4'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-version.outputs.release_commit_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
            25
      - name: Configure Java environment variables
        run: |
          echo "JAVA_17_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "JAVA_21_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "JAVA_25_HOME=$JAVA_HOME_25_X64" >> "$GITHUB_ENV"
      - name: Build Fabric ${{ matrix.minecraft }}
        run: |
          chmod +x gradlew modw
          python tools/kyro/template.py gradle "-Pmc=${{ matrix.minecraft }}" "-Ploader=fabric" build
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-jars-fabric-${{ matrix.minecraft }}
          path: build/${{ matrix.minecraft }}/fabric/libs/*.jar
          if-no-files-found: error

  forge:
    name: Forge ${{ matrix.minecraft }}
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        minecraft:
          - '1.18.2'
          - '1.19.2'
          - '1.19.4'
          - '1.20.1'
          - '1.20.4'
          - '1.21.1'
          - '1.21.4'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-version.outputs.release_commit_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
            25
      - name: Configure Java environment variables
        run: |
          echo "JAVA_17_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "JAVA_21_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "JAVA_25_HOME=$JAVA_HOME_25_X64" >> "$GITHUB_ENV"
      - name: Build Forge ${{ matrix.minecraft }}
        run: |
          chmod +x gradlew modw
          python tools/kyro/template.py gradle "-Pmc=${{ matrix.minecraft }}" "-Ploader=forge" build
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-jars-forge-${{ matrix.minecraft }}
          path: build/${{ matrix.minecraft }}/forge/libs/*.jar
          if-no-files-found: error

  neoforge:
    name: NeoForge ${{ matrix.minecraft }}
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        minecraft:
          - '1.20.4'
          - '1.20.6'
          - '1.21.1'
          - '1.21.4'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-version.outputs.release_commit_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
            25
      - name: Configure Java environment variables
        run: |
          echo "JAVA_17_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "JAVA_21_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "JAVA_25_HOME=$JAVA_HOME_25_X64" >> "$GITHUB_ENV"
      - name: Build NeoForge ${{ matrix.minecraft }}
        run: |
          chmod +x gradlew modw
          python tools/kyro/template.py gradle "-Pmc=${{ matrix.minecraft }}" "-Ploader=neoforge" build
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-jars-neoforge-${{ matrix.minecraft }}
          path: build/${{ matrix.minecraft }}/neoforge/libs/*.jar
          if-no-files-found: error

  publish-release:
    name: Publish Release
    needs: [check-version, fabric, forge, neoforge]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.check-version.outputs.release_commit_sha }}

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-jars-*
          path: release-artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        if: needs.check-version.outputs.github_release_exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ needs.check-version.outputs.target_tag }}
          name: ${{ needs.check-version.outputs.release_title }}
          body_path: Curseforge-desc.md
          prerelease: ${{ needs.check-version.outputs.is_prerelease == 'true' }}
          make_latest: ${{ needs.check-version.outputs.make_latest }}
          target_commitish: ${{ needs.check-version.outputs.release_commit_sha }}
          generate_release_notes: true
          files: release-artifacts/*.jar

  sync-description:
    name: Sync CurseForge Description
    needs: [check-version, publish-release]
    if: needs.check-version.outputs.is_prerelease != 'true'
    uses: ./.github/workflows/sync-curseforge-description.yml
    secrets:
      CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
