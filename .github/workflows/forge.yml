      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dimtoggle-${{ matrix.minecraft }}-forge
          path: build/${{ matrix.minecraft }}/forge/libs/*.jar
          if-no-files-found: ignore

  forge-future:
    name: Forge ${{ matrix.minecraft }}
    needs: validate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['26.1', '26.1.1', '26.1.2', '26.2', '26.3']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Build Forge ${{ matrix.minecraft }}
        run: |
          chmod +x gradlew modw
          python tools/kyro/template.py gradle "-Pmc=${{ matrix.minecraft }}" "-Ploader=forge" -PallowIncompleteTarget build
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dimtoggle-${{ matrix.minecraft }}-forge
          path: build/${{ matrix.minecraft }}/forge/libs/*.jar
          if-no-files-found: ignore

  forge-pipeline-summary:
    name: Forge Pipeline Summary
    needs: [forge-1-16, forge-1-17, forge-1-18, forge-1-19, forge-1-20, forge-1-21, forge-future]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Check build status
        run: |
          echo "All Forge version eras completed in pipeline."
