          java-version: '17'
      - name: Build Forge ${{ matrix.minecraft }}
        run: |
          chmod +x gradlew modw
          python tools/kyro/template.py gradle "-Pmc=${{ matrix.minecraft }}" "-Ploader=forge" build
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dimtoggle-${{ matrix.minecraft }}-forge
          path: build/${{ matrix.minecraft }}/forge/libs/*.jar
          if-no-files-found: ignore

  forge-1-20:
    name: Forge ${{ matrix.minecraft }}
    needs: validate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['1.20', '1.20.1', '1.20.2', '1.20.3', '1.20.4', '1.20.6']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
      - name: Configure Java environment variables
        run: |
          echo "JAVA_17_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "JAVA_21_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
      - name: Build Forge ${{ matrix.minecraft }}
        run: |
          chmod +x gradlew modw
          python tools/kyro/template.py gradle "-Pmc=${{ matrix.minecraft }}" "-Ploader=forge" build
      - name: Upload artifact
        uses: actions/upload-artifact@v4
