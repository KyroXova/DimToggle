name: Forge Pipeline

on:
  pull_request:
    branches: [ master, main ]
  push:
    branches: [ main, dev/** ]

jobs:
  validate:
    name: Validate Core & Matrix
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate matrix
        run: python tools/kyro/template.py validate
      - name: Core tests
        run: python tools/kyro/template.py core

  forge-1-16:
    name: Forge ${{ matrix.minecraft }}
    needs: validate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['1.16.1', '1.16.2', '1.16.3', '1.16.4', '1.16.5']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Build Forge ${{ matrix.minecraft }}
        run: |
          chmod +x gradlew modw
          python tools/kyro/template.py gradle "-Pmc=${{ matrix.minecraft }}" "-Ploader=forge" -PallowIncompleteTarget build
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dimtoggle-${{ matrix.minecraft }}-forge
          path: build/${{ matrix.minecraft }}/forge/libs/*.jar
          if-no-files-found: ignore

  forge-1-17:
    name: Forge ${{ matrix.minecraft }}
    needs: validate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['1.17.1']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '16'
      - name: Build Forge ${{ matrix.minecraft }}
        run: |
          chmod +x gradlew modw
          python tools/kyro/template.py gradle "-Pmc=${{ matrix.minecraft }}" "-Ploader=forge" -PallowIncompleteTarget build
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dimtoggle-${{ matrix.minecraft }}-forge
          path: build/${{ matrix.minecraft }}/forge/libs/*.jar
          if-no-files-found: ignore

  forge-1-18:
    name: Forge ${{ matrix.minecraft }}
    needs: validate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['1.18', '1.18.1', '1.18.2']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build Forge ${{ matrix.minecraft }}
        run: |
          chmod +x gradlew modw
          python tools/kyro/template.py gradle "-Pmc=${{ matrix.minecraft }}" "-Ploader=forge" build
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dimtoggle-${{ matrix.minecraft }}-forge
          path: build/${{ matrix.minecraft }}/forge/libs/*.jar
          if-no-files-found: ignore

  forge-1-19:
    name: Forge ${{ matrix.minecraft }}
    needs: validate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['1.19', '1.19.1', '1.19.2', '1.19.3', '1.19.4']
