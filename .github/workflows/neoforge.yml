name: NeoForge Pipeline

on:
  pull_request:
    branches: [ master, main ]
  push:
    branches: [ main, dev/** ]

jobs:
  validate:
    name: Validate Core & Matrix
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate matrix
        run: python tools/kyro/template.py validate
      - name: Core tests
        run: python tools/kyro/template.py core

  neoforge-1-20:
    name: NeoForge ${{ matrix.minecraft }}
    needs: validate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['1.20.2', '1.20.3', '1.20.4', '1.20.5', '1.20.6']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
      - name: Configure Java environment variables
        run: |
          echo "JAVA_17_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "JAVA_21_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
      - name: Build NeoForge ${{ matrix.minecraft }}
        run: |
          chmod +x gradlew modw
          python tools/kyro/template.py gradle "-Pmc=${{ matrix.minecraft }}" "-Ploader=neoforge" build
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dimtoggle-${{ matrix.minecraft }}-neoforge
          path: build/${{ matrix.minecraft }}/neoforge/libs/*.jar
          if-no-files-found: ignore

  neoforge-1-21:
    name: NeoForge ${{ matrix.minecraft }}
    needs: validate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['1.21', '1.21.1', '1.21.2', '1.21.3', '1.21.4', '1.21.5', '1.21.6', '1.21.7', '1.21.8', '1.21.9', '1.21.10', '1.21.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build NeoForge ${{ matrix.minecraft }}
        run: |
          chmod +x gradlew modw
          python tools/kyro/template.py gradle "-Pmc=${{ matrix.minecraft }}" "-Ploader=neoforge" -PallowIncompleteTarget build
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dimtoggle-${{ matrix.minecraft }}-neoforge
          path: build/${{ matrix.minecraft }}/neoforge/libs/*.jar
          if-no-files-found: ignore

  neoforge-future:
    name: NeoForge ${{ matrix.minecraft }}
    needs: validate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['26.1', '26.1.1', '26.1.2', '26.2', '26.3']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Build NeoForge ${{ matrix.minecraft }}
        run: |
          chmod +x gradlew modw
          python tools/kyro/template.py gradle "-Pmc=${{ matrix.minecraft }}" "-Ploader=neoforge" -PallowIncompleteTarget build
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dimtoggle-${{ matrix.minecraft }}-neoforge
          path: build/${{ matrix.minecraft }}/neoforge/libs/*.jar
          if-no-files-found: ignore

  neoforge-pipeline-summary:
    name: NeoForge Pipeline Summary
    needs: [neoforge-1-20, neoforge-1-21, neoforge-future]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Check build status
        run: |
          echo "All NeoForge version eras completed in pipeline."
