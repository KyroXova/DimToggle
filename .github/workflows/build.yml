name: build

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv4Stack=true -Dsun.net.client.defaultConnectTimeout=60000 -Dsun.net.client.defaultReadTimeout=120000"

jobs:
  generate-matrix:
    name: Generate Matrix
    if: |
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/main' &&
       (contains(github.event.head_commit.message, '(#') ||
        contains(github.event.head_commit.message, 'Merge pull request #') ||
        contains(github.event.head_commit.message, 'Merge branch ')))
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      total_batches: ${{ steps.gen.outputs.total_batches }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate Batched Matrix
        id: gen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python tools/kyro/generate_matrix.py --batches 18 --mode auto

  build:
    name: "${{ matrix.name }}"
    needs: generate-matrix
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      max-parallel: 18
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Java (Standard)
        if: ${{ !matrix.has_1_17 }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17
            21
            25

      - name: Set up Java (Zulu with JDK 16)
        if: ${{ matrix.has_1_17 }}
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: |
            8
            16
            17
            21
            25

      - name: Configure Java environment variables
        run: |
          echo "JAVA_8_HOME=${JAVA_HOME_8_X64:-$JAVA_HOME}" >> "$GITHUB_ENV"
          echo "JAVA_16_HOME=${JAVA_HOME_16_X64:-$JAVA_HOME}" >> "$GITHUB_ENV"
          echo "JAVA_17_HOME=${JAVA_HOME_17_X64:-$JAVA_HOME}" >> "$GITHUB_ENV"
          echo "JAVA_21_HOME=${JAVA_HOME_21_X64:-$JAVA_HOME}" >> "$GITHUB_ENV"
          echo "JAVA_25_HOME=${JAVA_HOME_25_X64:-$JAVA_HOME}" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: wrapper
          cache-read-only: false
          add-job-summary: 'never'

      - name: Pre-warm Mojang Metadata
        run: |
          (curl -f -s -S --retry 3 --max-time 15 https://launchermeta.mojang.com/mc/game/version_manifest_v2.json > /dev/null 2>&1 &)
          (curl -f -s -S --retry 3 --max-time 15 https://piston-meta.mojang.com/mc/game/version_manifest_v2.json > /dev/null 2>&1 &)
          wait

      - name: Build batch ${{ matrix.batch_id }}
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3
        with:
          timeout_minutes: 30
          max_attempts: 3
          retry_wait_seconds: 15
          command: |
            chmod +x gradlew modw
            ./gradlew ${{ matrix.tasks }} --no-daemon --max-workers=2 --build-cache -Dorg.gradle.internal.http.socketTimeout=60000 -Dorg.gradle.internal.http.connectionTimeout=60000

      - name: Upload batch artifacts
        uses: actions/upload-artifact@v4
        with:
          name: "${{ matrix.batch_id }}-artifacts"
          path: build/*/*/libs/*.jar
          if-no-files-found: error

      - name: Generate Batch Summary
        if: always()
        run: |
          python -c "
          import os, glob, json

          cf_map = {}
          cf_json_path = 'tools/kyro/curseforge_files.json'
          if os.path.exists(cf_json_path):
              try:
                  with open(cf_json_path, 'r', encoding='utf-8') as f:
                      cf_map = json.load(f)
              except Exception:
                  pass

          tasks = '${{ matrix.tasks }}'.split()
          runner_name = '${{ runner.name }}'
          batch_id = '${{ matrix.batch_id }}'
          est_weight = '${{ matrix.estimated_weight }}'

          lines = []
          lines.append(f'### Batch {batch_id} Target Summary')
          lines.append(f'**Runner:** \`{runner_name}\` | **Estimated Weight:** {est_weight}s | **Targets:** {len(tasks)}')
          lines.append('')
          lines.append('| Minecraft | Loader | Status | Built Artifact | File Size | CurseForge |')
          lines.append('| :--- | :---: | :---: | :--- | :---: | :---: |')

          for task in tasks:
              parts = task.replace('build_', '')
              ldr = parts.split('_')[-1]
              mc_sanitized = parts[:-(len(ldr) + 1)]
              mc = mc_sanitized.replace('_', '.')
              
              pattern = f'build/{mc}/{ldr}/libs/*.jar'
              found = [f for f in glob.glob(pattern) if not f.endswith('-dev.jar') and not f.endswith('-sources.jar')]
              if found and os.path.exists(found[0]):
                  jar_path = found[0]
                  jar_name = os.path.basename(jar_path)
                  size_bytes = os.path.getsize(jar_path)
                  size_kb = f'{size_bytes / 1024.0:.1f} KB'
                  if jar_name in cf_map:
                      fid = cf_map[jar_name]
                      cf_cell = f'[Published (ID: {fid})](https://www.curseforge.com/minecraft/mc-mods/dimtoggle/files/{fid})'
                  else:
                      cf_cell = '[CurseForge Files](https://www.curseforge.com/minecraft/mc-mods/dimtoggle/files)'
                  lines.append(f'| {mc} | {ldr} | Success | \`{jar_name}\` | {size_kb} | {cf_cell} |')
              else:
                  lines.append(f'| {mc} | {ldr} | Failed / Pending | None | N/A | [Pending](https://www.curseforge.com/minecraft/mc-mods/dimtoggle/files) |')

          summary_path = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary_path:
              with open(summary_path, 'a', encoding='utf-8') as f:
                  f.write('\n'.join(lines) + '\n\n')
          "
