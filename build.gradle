plugins { id 'base' }

def python = System.getProperty('os.name').toLowerCase().contains('windows') ? 'python' : 'python3'
def helper = file('tools/kyro/template.py').absolutePath

tasks.register('buildTarget', Exec) {
    commandLine python, helper, 'gradle', "-Pmc=${project.findProperty('mc') ?: '1.20.1'}", "-Ploader=${project.findProperty('loader') ?: 'fabric'}", 'build'
}
tasks.named('build') { dependsOn 'buildTarget' }
tasks.register('cleanTarget', Exec) {
    commandLine python, helper, 'gradle', "-Pmc=${project.findProperty('mc') ?: '1.20.1'}", "-Ploader=${project.findProperty('loader') ?: 'fabric'}", 'clean'
}
tasks.named('clean') {
    setDelete([] as Set)
    dependsOn 'cleanTarget'
}
['runClient', 'runServer'].each { targetTask ->
    tasks.register(targetTask, Exec) {
        def mc = project.findProperty('mc') ?: '1.20.1'
        def ldr = project.findProperty('loader') ?: 'fabric'
        def cmd = [python, helper, 'gradle', "-Pmc=${mc}", "-Ploader=${ldr}"]
        if (project.hasProperty('allowIncompleteTarget')) {
            cmd << '-PallowIncompleteTarget'
        }
        cmd << targetTask
        commandLine cmd
    }
}
tasks.register('coreCheck', Exec) { commandLine python, helper, 'core' }
tasks.register('validateMatrix', Exec) { commandLine python, helper, 'validate' }
tasks.register('validateTemplate', Exec) { commandLine python, helper, 'validate' }

def inventoryFile = file('targets.json')
if (inventoryFile.isFile()) {
    def targetsData = new groovy.json.JsonSlurper().parse(inventoryFile)['targets']
    targetsData.each { target ->
        def mcVer = target['minecraft']
        def mcSanitized = mcVer.replace('.', '_')
        target['loaders'].keySet().each { ldr ->
            ['runClient', 'runServer'].each { verb ->
                def taskName = "${verb}_${mcSanitized}_${ldr}"
                tasks.register(taskName, Exec) {
                    group = "minecraft ${verb}"
                    description = "Runs ${verb} for Minecraft ${mcVer} (${ldr})"
                    def cmd = [python, helper, 'gradle', "-Pmc=${mcVer}", "-Ploader=${ldr}"]
                    if (project.hasProperty('allowIncompleteTarget')) {
                        cmd << '-PallowIncompleteTarget'
                    }
                    cmd << verb
                    commandLine cmd
                }
            }
        }
    }
}
