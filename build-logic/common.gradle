def metadata = new Properties()
new File(templateRoot, 'properties/mod.properties').withReader('UTF-8') { metadata.load(it) }
ext.modMetadata = metadata
group = metadata.getProperty('mod.group')
version = metadata.getProperty('mod.version')
buildDir = new File(templateRoot, targetLoader == 'core' ? 'build/core' : "build/${targetMinecraft}/${targetLoader}")
base.archivesName = "${metadata.getProperty('mod.id')}-${targetMinecraft}-${targetLoader}"

repositories {
    maven {
        name = 'SpongeMaven'
        url = 'https://repo.spongepowered.org/repository/maven-public/'
        content {
            includeGroupByRegex 'org\\.spongepowered.*'
        }
    }
    maven {
        name = 'GoogleMavenCentral'
        url = 'https://maven-central.storage-download.googleapis.com/maven2/'
        content {
            excludeGroupByRegex 'remapped.*'
            excludeGroupByRegex 'loom.*'
            excludeGroupByRegex 'net\\.fabricmc.*'
            excludeGroupByRegex 'net\\.minecraftforge.*'
            excludeGroupByRegex 'net\\.neoforged.*'
            excludeGroup 'minecraft'
            excludeGroupByRegex 'net\\.minecraft.*'
            excludeGroup 'com.mojang'
            excludeGroupByRegex 'org\\.spongepowered.*'
            excludeGroupByRegex 'gradle\\.plugin.*'
        }
    }
}
repositories.all { repo ->
    if (repo instanceof MavenArtifactRepository) {
        def u = repo.url.toString()
        if (u.contains('repo.maven.apache.org') || u.contains('repo1.maven.org')) {
            repo.url = uri('https://maven-central.storage-download.googleapis.com/maven2/')
        }
    }
}
def jvmTarget = targetLoader == 'core' ? 21 : targetPins.getProperty('java.release').toInteger()
def toolchainVersion = jvmTarget == 16 ? 17 : jvmTarget
java {
    toolchain.languageVersion = JavaLanguageVersion.of(toolchainVersion)
    sourceCompatibility = JavaVersion.toVersion(targetPins.getProperty('java.release'))
    targetCompatibility = JavaVersion.toVersion(targetPins.getProperty('java.release'))
}
sourceSets {
    main {
        java.setSrcDirs(['common/src/main/java', "versions/${targetMinecraft}/common/src/main/java", "versions/${targetMinecraft}/${targetLoader}/src/main/java"].collect { new File(templateRoot,it) })
        resources.setSrcDirs(['common/src/main/resources', "versions/${targetMinecraft}/common/src/main/resources", "versions/${targetMinecraft}/${targetLoader}/src/main/resources"].collect { new File(templateRoot,it) })
        if (project.hasProperty('dimtoggleGameTest')) {
            java.srcDir(new File(templateRoot, "versions/${targetMinecraft}/${targetLoader}/src/gametest/java"))
            resources.srcDir(new File(templateRoot, "versions/${targetMinecraft}/${targetLoader}/src/gametest/resources"))
        }
    }
    test {
        java.setSrcDirs([new File(templateRoot,'common/src/test/java'), new File(templateRoot,"versions/${targetMinecraft}/${targetLoader}/src/test/java")])
        resources.setSrcDirs([new File(templateRoot,'common/src/test/resources')])
    }
}
dependencies {
    implementation 'com.google.code.gson:gson:2.8.9'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'net.luckperms:api:5.4'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
processResources {
    exclude '**/.gitkeep'
    duplicatesStrategy = DuplicatesStrategy.FAIL
    def values = [mod_id: metadata.getProperty('mod.id'), mod_name: metadata.getProperty('mod.name'), mod_version: version.toString(), mod_description: metadata.getProperty('mod.description'), mod_authors: metadata.getProperty('mod.authors', 'Kingodogo, KyroXova'), mod_license: metadata.getProperty('mod.license'), minecraft_version: targetMinecraft, java_release: targetPins.getProperty('java.release'), loader_version: targetPins.getProperty("${targetLoader}.version", '')]
    inputs.properties(values)
    filesMatching(['fabric.mod.json', 'META-INF/mods.toml', 'META-INF/neoforge.mods.toml']) { expand(values) }
}
jar {
    duplicatesStrategy = DuplicatesStrategy.FAIL
    from(new File(templateRoot,'LICENSE'))
    manifest { attributes('Implementation-Version': project.version) }
}
apply plugin: 'jacoco'
jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}
test { maxParallelForks = 2 }
